name: build-linux

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref/commit in private SOURCE_REPO"
        required: true
        default: "main"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "linux"
      app_version:
        description: "APP_VERSION passed to flutter --dart-define"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for private clone
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Clone private source repo
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO_SSH_URL }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" source
          cd source
          git checkout "$SOURCE_REF"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev
          # tray_manager (Linux) dependency:
          # - Ubuntu/Debian typically provide ayatana-appindicator3-0.1
          # - Older distros may still use appindicator3-0.1
          sudo apt-get install -y libayatana-appindicator3-dev || sudo apt-get install -y libappindicator3-dev

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build (source script)
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          bash ./source/tool/ci/build_linux.sh --out-dir ./source/out

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: source/out/*
          retention-days: 1
