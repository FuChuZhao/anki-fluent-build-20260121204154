name: build-android

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref/commit in private SOURCE_REPO"
        required: true
        default: "main"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "android"
      app_version:
        description: "APP_VERSION passed to flutter --dart-define"
        required: false
        default: ""
      mode:
        description: "debug|release (release requires signing setup)"
        required: false
        default: "debug"
      with_backend:
        description: "0|1 - bundle Rust FFI backend (libanki_ffi.so) via cargo-ndk"
        required: false
        default: "0"
      ndk_version:
        description: "Android NDK version (sdkmanager 'ndk;VERSION')"
        required: false
        default: "26.1.10909125"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for private clone
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Clone private source repo
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO_SSH_URL }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" source
          cd source
          git checkout "$SOURCE_REF"

      - name: Setup Java (Android)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install build dependencies
        if: ${{ inputs.with_backend == '1' }}
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config protobuf-compiler

      - name: Install Android NDK
        if: ${{ inputs.with_backend == '1' }}
        shell: bash
        env:
          NDK_VERSION: ${{ inputs.ndk_version }}
        run: |
          set -euo pipefail
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          sdkmanager "ndk;$NDK_VERSION"
          echo "ANDROID_NDK_HOME=$ANDROID_SDK_ROOT/ndk/$NDK_VERSION" >> "$GITHUB_ENV"

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        if: ${{ inputs.with_backend == '1' }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        if: ${{ inputs.with_backend == '1' }}
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-ndk

      - name: Build Android APK (source script)
        shell: bash
        env:
          APP_VERSION: ${{ inputs.app_version }}
        run: |
          set -euo pipefail
          args=(--out-dir out --mode "${{ inputs.mode }}")
          if [[ "${{ inputs.with_backend }}" == "1" || "${{ inputs.with_backend }}" == "true" ]]; then
            args+=(--with-backend)
          fi
          bash ./source/tool/ci/build_android.sh "${args[@]}"

      - name: Upload artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: source/out/*
          retention-days: 1
