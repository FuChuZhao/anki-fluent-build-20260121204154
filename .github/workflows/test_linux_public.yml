name: test-linux

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git ref/commit in private SOURCE_REPO"
        required: true
        default: "main"
      artifact_name:
        description: "Artifact name"
        required: true
        default: "test-logs-linux"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH for private clone
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.SOURCE_REPO_SSH_KEY }}

      - name: Clone private source repo
        shell: bash
        env:
          SOURCE_REPO: ${{ secrets.SOURCE_REPO_SSH_URL }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          git clone "$SOURCE_REPO" source
          cd source
          git checkout "$SOURCE_REF"

      - name: Install Linux build dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev ripgrep

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Run CI checks (source script)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p ./source/out
          bash ./source/tool/ci/run_ci_checks.sh 2>&1 | tee ./source/out/ci_checks.log

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.artifact_name }}
          path: source/out/**
          retention-days: 1

